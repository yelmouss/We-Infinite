<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>We-Infinite</title>
    <link rel="stylesheet" href="popup.css" />
</head>
<body class="popup-root">
    <header class="header">
        <h1>🚀 We-Infinite</h1>
        <p>Accès centralisé aux administrations WordPress</p>
    </header>

    <section class="stats" id="stats">
        <div class="stat">
            <span class="stat-label">Sites chargés</span>
            <span class="stat-value" id="totalSites">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">Agences chargées</span>
            <span class="stat-value" id="loadedAgencies">0</span>
        </div>
    </section>

    <section class="progress-container hidden" id="progressContainer">
        <div class="progress-labels">
            <span id="progressText">Chargement des agences…</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-wrapper">
            <div class="progress-bar" id="progressBar" style="width:0%"></div>
        </div>
    </section>

    <section class="actions" id="main-content">
        <button id="openAllAgencies" class="button secondary-button">
            <span>📂</span>
            Ouvrir toutes les agences
        </button>
        <div class="agency-filter">
            <select id="agencySelect" class="select">
                <option value="">-- Sélectionner une agence --</option>
            </select>
            <button id="openSelectedAgency" class="button tertiary-button" disabled>
                <span>🔎</span>
                Charger l'agence
            </button>
        </div>
        <button id="openAdmin" class="button primary-button">
            <span>⚡</span>
            Ouvrir l'administration (onglet actif)
        </button>
        <button id="showSites" class="button info-button" title="Afficher la liste des sites">
            <span class="icon-inline" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 4H10V10H4V4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14 4H20V10H14V4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 14H10V20H4V14Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M18 14L21 17L18 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14 17H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            Voir les sites chargés
        </button>
    </section>

    <section id="siteListContainer" class="site-list-container hidden">
        <div class="site-list-header">
            <h2>Sites disponibles</h2>
            <button id="closeSites" class="icon-button" title="Fermer">✖</button>
        </div>
        <ul id="siteList" class="site-list"></ul>
    </section>

    <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Chargement…</p>
    </div>

    <div id="status" class="status hidden"></div>

    <footer class="footer">
        <small>Développée par <strong>We Maintenance</strong></small>
    </footer>

    <script src="popup.js"></script>
</body>
</html>
